[project]
name = "salespilot"
version = "0.1.0"
description = "Multi-tenant sales platform — backend"
requires-python = ">=3.13"

dependencies = [
    # Web framework
    "fastapi[standard]>=0.118",
    "uvicorn[standard]>=0.34",

    # Database
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",   # alembic uses sync driver for migrations

    # Validation / settings
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",

    # Auth / security
    "passlib[argon2]>=1.7.4",
    "pyjwt>=2.10",
    "itsdangerous>=2.2",   # for signed magic-link tokens

    # Cache / queue
    "redis[hiredis]>=5.2",

    # Mail
    "aiosmtplib>=3.0",
    "jinja2>=3.1",         # email templates

    # Misc
    "python-multipart>=0.0.20",
    "structlog>=25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "dnspython>=2.7",
    "anthropic>=0.40",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-passlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["salespilot*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC"]
ignore = ["S101"]   # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"salespilot/tests/*" = ["S"]
"alembic/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["salespilot/tests"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
